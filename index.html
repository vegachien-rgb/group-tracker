<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>領隊位置分享</title>
<style>body{font:16px system-ui,'Noto Sans TC',sans-serif;max-width:520px;margin:30px auto;padding:15px;color:#183047}label{display:block;margin:15px 0}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #adb9c5;border-radius:8px;margin-top:5px}button{padding:13px 16px;border:0;background:#126b8f;color:white;border-radius:8px;margin:8px 8px 8px 0}button:disabled{opacity:.5}#stop{background:#a53737}#message{padding:16px;background:#eef4f7;border-radius:8px;line-height:1.6}small{color:#526574}</style></head><body>
<h2>📍 領隊位置分享</h2><p>僅領隊使用。開始後請保持本頁開啟且螢幕亮起。</p>
<label>Apps Script Web App 網址<input id="endpoint" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off"></label>
<label>領隊專用密鑰<input id="key" type="password" placeholder="從 Apps Script 執行紀錄取得" autocomplete="off"></label>
<button id="start">開始分享</button><button id="stop" disabled>停止分享</button>
<div id="message" role="status">尚未開始</div>
<p><small>為保護隱私，密鑰不會儲存在 GitHub 程式碼或本機永久儲存區。定位上傳採隱藏表單，網頁只能確認已送出，不能可靠確認伺服器已寫入；請使用觀眾頁或 Google Sheets 驗證。</small></p>
<iframe name="uploadTarget" style="display:none" title="位置上傳"></iframe>
<form id="sender" method="POST" target="uploadTarget" style="display:none">
<input name="key"><input name="action"><input name="lat"><input name="lng"><input name="accuracy">
</form>
<script>
const $ = id => document.getElementById(id);
const form = $('sender');
let running = false;
let timer = null;
let inProgress = false;
let generation = 0;
const POLL_MS = 25000;
const MAX_FIX_AGE_MS = 60000;
function msg(text) { $('message').textContent = text; }
function send(action, pos) {
  const url = $('endpoint').value.trim();
  const key = $('key').value.trim();
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec(?:\?.*)?$/.test(url)) {
    throw new Error('請填入正確的 Apps Script /exec 網址');
  }
  if (!key) throw new Error('請輸入領隊密鑰');
  form.action = url;
  form.elements.namedItem('key').value = key;
  form.elements.namedItem('action').value = action;
  form.elements.namedItem('lat').value = pos ? String(pos.coords.latitude) : '';
  form.elements.namedItem('lng').value = pos ? String(pos.coords.longitude) : '';
  form.elements.namedItem('accuracy').value = pos ? String(pos.coords.accuracy) : '';
  // 跨網域隱藏表單無法可靠讀取 Apps Script 回應；送出不等於寫入成功。
  form.submit();
}
function locateAndUpload(id) {
  if (!running || inProgress || id !== generation) return;
  inProgress = true;
  msg('正在取得新的 GPS 定位…');
  navigator.geolocation.getCurrentPosition(pos => {
    inProgress = false;
    if (!running || id !== generation) return;
    const ageMs = Date.now() - pos.timestamp;
    if (!Number.isFinite(ageMs) || ageMs < -10000 || ageMs > MAX_FIX_AGE_MS) {
      msg('GPS 回傳的定位時間過舊或異常，未上傳；將於下一次自動重試');
      return;
    }
    try {
      send('update', pos);
      msg('已送出位置更新請求：' + new Date().toLocaleTimeString('zh-TW') +
          '；定位資料約 ' + Math.round(ageMs / 1000) + ' 秒前；精度約 ' +
          Math.round(pos.coords.accuracy) + ' 公尺（請至 Sheets 確認寫入）');
    } catch (err) {
      msg('送出失敗：' + err.message);
    }
  }, err => {
    inProgress = false;
    if (!running || id !== generation) return;
    msg('定位失敗（' + err.code + '）：' + err.message + '；25 秒後重試。請保持螢幕亮起。');
  }, {
    enableHighAccuracy: true,
    maximumAge: 0,
    timeout: 18000
  });
}
$('start').onclick = () => {
  try {
    if (!navigator.geolocation) throw new Error('瀏覽器不支援定位');
    if (!window.isSecureContext) throw new Error('請使用 HTTPS 網址');
    if (!$('endpoint').value.trim() || !$('key').value.trim()) throw new Error('請輸入網址和密鑰');
    if (running) return;
    running = true;
    inProgress = false;
    const id = ++generation;
    $('start').disabled = true;
    $('stop').disabled = false;
    $('endpoint').disabled = true;
    $('key').disabled = true;
    locateAndUpload(id);
    timer = setInterval(() => locateAndUpload(id), POLL_MS);
  } catch (err) {
    msg(err.message);
  }
};
$('stop').onclick = () => {
  if (!running) return;
  running = false;
  ++generation;
  inProgress = false;
  if (timer !== null) clearInterval(timer);
  timer = null;
  try {
    send('stop', null);
    msg('已送出停止分享請求；請至 Google Sheets 確認 E2 變成 FALSE');
  } catch (err) {
    msg('停止請求送出失敗：' + err.message);
  }
  $('start').disabled = false;
  $('stop').disabled = true;
  $('endpoint').disabled = false;
  $('key').disabled = false;
};
// 在背景或鎖屏時，瀏覽器可暫停計時器；回前景立即補查一次。
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && running) locateAndUpload(generation);
});
window.addEventListener('pagehide', () => {
  if (timer !== null) clearInterval(timer);
  timer = null;
  running = false;
  ++generation;
});
</script></body></html>
